<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBox — Твой мир. Твоя станция.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #030712;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ФОНОВЫЕ ЭФФЕКТЫ И СВЕЧЕНИЕ */
        .bg-glow {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 55vw;
            height: 75vh;
            background: radial-gradient(circle at bottom right, rgba(0, 112, 243, 0.25) 0%, rgba(0, 242, 254, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* ШАПКА */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00f2fe, #0070f3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .brand-logo-icon svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            margin-left: 50px;
        }

        .nav-item {
            font-size: 1.05rem;
            color: #9ca3af;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            position: relative;
        }

        .nav-item.active {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00f2fe;
            box-shadow: 0 0 10px #00f2fe;
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-icon-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .header-icon-btn:hover { color: #fff; }

        .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #60a5fa;
            position: relative;
            cursor: pointer;
        }

        .profile-avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid #030712;
        }

        .clock-display {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 50px 40px 50px;
            z-index: 10;
        }

        /* КАРУСЕЛЬ ИГР */
        .games-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }
        .games-row::-webkit-scrollbar { display: none; }

        .game-tile {
            min-width: 110px;
            height: 145px;
            background: #111827;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .game-tile.side-icon-tile {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(17, 24, 39, 0.7);
            font-size: 1.8rem;
        }

        .game-tile:hover {
            transform: translateY(-6px) scale(1.05);
            border-color: rgba(255,255,255,0.4);
        }

        .game-tile.selected {
            transform: translateY(-8px) scale(1.08);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        .game-tile .tile-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 8px 6px;
            font-size: 0.75rem;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* НИЖНЯЯ ПАНЕЛЬ ИНФОРМАЦИИ ОБ ИГРЕ */
        .game-info-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .info-left h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-left p {
            color: #9ca3af;
            font-size: 1.15rem;
            margin-bottom: 25px;
            max-width: 550px;
        }

        .action-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .play-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 14px 45px;
            border-radius: 35px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
            transform: scale(1.04);
        }

        .options-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .options-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ВИДЖЕТ ТРОФЕЕВ СПРАВА */
        .trophies-card {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .trophy-icon-box {
            font-size: 2.2rem;
        }

        .trophy-data-group div:first-child {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trophy-data-group div:last-child {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        .divider {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* СТАТУС ГЕЙМПАДА */
        .gamepad-pill {
            position: fixed;
            bottom: 15px;
            left: 50px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .gamepad-pill.active {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* ОКНО ЗАПУСКА ИГРЫ */
        #game-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }

        .modal-topbar {
            padding: 15px 30px;
            display: flex;
            justify-content: flex-end;
            background: #0b0f19;
        }

        .exit-game-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .exit-game-btn:hover { background: #ef4444; }

        #game-modal iframe {
            flex: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- ШАПКА -->
    <header>
        <div class="brand-container">
            <div class="brand-logo-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="brand-name">PlayBox</div>
            <div class="nav-menu">
                <div class="nav-item active">Игры</div>
                <div class="nav-item">Мультимедиа</div>
            </div>
        </div>

        <div class="header-right">
            <button class="header-icon-btn">🔍</button>
            <button class="header-icon-btn">⚙️</button>
            <div class="profile-avatar"></div>
            <div class="clock-display" id="clock">14:26</div>
        </div>
    </header>

    <!-- ИНТЕРАКТИВНЫЙ НИЖНИЙ БЛОК -->
    <div class="main-content">
        <!-- КАРУСЕЛЬ КАК НА СКРИНШОТЕ -->
        <div class="games-row" id="games-carousel">
            <div class="game-tile side-icon-tile" title="Устройства">🎮</div>
            <!-- Сюда динамически встают карточки игр с картинками -->
        </div>

        <!-- ИНФОРМАЦИЯ О ВЫБРАННОЙ ИГРЕ -->
        <div class="game-info-panel">
            <div class="info-left">
                <h1 id="game-title">Assassin's Creed</h1>
                <p id="game-desc">Исследуйте тайны древних цивилизаций и станьте легендарным мастером скрытных убийств.</p>
                <div class="action-row">
                    <button class="play-btn" onclick="launchGame()">Играть</button>
                    <button class="options-btn" onclick="alert('Дополнительные параметры игры')">⋯</button>
                </div>
            </div>

            <div class="trophies-card">
                <div class="trophy-icon-box">🏆</div>
                <div class="trophy-data-group">
                    <div>Выполнено</div>
                    <div id="trophy-val">12%</div>
                </div>
                <div class="divider"></div>
                <div class="trophy-data-group">
                    <div>Получено</div>
                    <div>9/50</div>
                </div>
            </div>
        </div>
    </div>

    <!-- СТАТУС ГЕЙМПАДА -->
    <div class="gamepad-pill" id="gp-status">
        <span>🎮</span> <span id="gp-text">Геймпад не подключен</span>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ИГРЫ -->
    <div id="game-modal">
        <div class="modal-topbar">
            <button class="exit-game-btn" onclick="closeGame()">Выйти из игры</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Часы
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Список игр, в точности как на твоем крутом скриншоте
        const gamesData = [
            { 
                title: "Assassin's Creed", 
                desc: "Исследуйте тайны древних цивилизаций и станьте легендарным мастером скрытных убийств.", 
                trophies: "12%", 
                url: "https://playpager.com/embed/neon-rider/index.html",
                bg: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=400" 
            },
            { 
                title: "Spider-Man", 
                desc: "Пролетите на паутине над неоновым Нью-Йорком и защитите город от суперзлодеев.", 
                trophies: "45%", 
                url: "https://playpager.com/embed/retro-bowl/index.html",
                bg: "https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=400" 
            },
            { 
                title: "God of War", 
                desc: "Суровое путешествие спартанского воина и его сына по мирам скандинавской мифологии.", 
                trophies: "68%", 
                url: "https://playpager.com/embed/neon-rider/index.html",
                bg: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=400" 
            },
            { 
                title: "Red Dead Redemption II", 
                desc: "Эпическая история о жизни на закате эпохи Дикого Запада в открытом мире.", 
                trophies: "29%", 
                url: "https://playpager.com/embed/retro-bowl/index.html",
                bg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400" 
            },
            { 
                title: "Forza Horizon", 
                desc: "Фестиваль скорости, экстремальных гонок и лучших суперкаров планеты.", 
                trophies: "81%", 
                url: "https://playpager.com/embed/neon-rider/index.html",
                bg: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=400" 
            },
            { 
                title: "Minecraft", 
                desc: "Творите, исследуйте и выживайте в бесконечных кубических мирах вместе с друзьями.", 
                trophies: "95%", 
                url: "https://playpager.com/embed/retro-bowl/index.html",
                bg: "https://images.unsplash.com/photo-1627856013091-fed6e4e30e52?w=400" 
            },
            { 
                title: "The Last of Us", 
                desc: "Эмоциональное выживание в постапокалиптическом мире, охваченном пандемией.", 
                trophies: "50%", 
                url: "https://playpager.com/embed/neon-rider/index.html",
                bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400" 
            },
            { 
                title: "Horizon Zero Dawn", 
                desc: "Укротите механических чудовищ будущего в диких землях первобытной природы.", 
                trophies: "34%", 
                url: "https://playpager.com/embed/retro-bowl/index.html",
                bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400" 
            }
        ];

        let currentIndex = 0;

        function renderCarousel() {
            const container = document.getElementById('games-carousel');
            // Сохраняем первую иконку устройств, дальше генерируем игры
            let html = `<div class="game-tile side-icon-tile" title="Устройства">🎮</div>`;
            
            gamesData.forEach((game, idx) => {
                html += `
                    <div class="game-tile ${idx === currentIndex ? 'selected' : ''}" 
                         style="background-image: url('${game.bg}');" 
                         onclick="selectGame(${idx})">
                        <div class="tile-overlay">${game.title}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectGame(index) {
            currentIndex = index;
            const game = gamesData[index];
            document.getElementById('game-title').innerText = game.title;
            document.getElementById('game-desc').innerText = game.desc;
            document.getElementById('trophy-val').innerText = game.trophies;
            renderCarousel();
        }

        renderCarousel();

        function launchGame() {
            const game = gamesData[currentIndex];
            document.getElementById('game-frame').src = game.url;
            document.getElementById('game-modal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }

        // Поддержка реального геймпада
        window.addEventListener("gamepadconnected", (e) => {
            const pill = document.getElementById('gp-status');
            pill.classList.add('active');
            document.getElementById('gp-text').innerText = e.gamepad.id.split('(')[0];
        });

        window.addEventListener("gamepaddisconnected", () => {
            const pill = document.getElementById('gp-status');
            pill.classList.remove('active');
            document.getElementById('gp-text').innerText = "Геймпад не подключен";
        });
    </script>
</body>
</html>
