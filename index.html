<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>PlayBox — Твой мир. Твоя станция.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#0070f3;--acc2:#4aa3ff;--bg:#05070d;--bg2:#0a0e18;--bg3:#111624;--txt:#fff;--txt2:#b8c2d4;--txt3:#6b7690}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
body.site-mode{overflow-y:auto;overflow-x:hidden}

/* ============ ЗАГРУЗКА ============ */
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at center,#0a1428,#05070d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s;padding:20px}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp-cube{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.sp-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc);border-right-color:rgba(74,163,255,.4);animation:spin 2.5s linear infinite}
.sp-ring::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid transparent;border-bottom-color:rgba(74,163,255,.5);animation:spin 3.5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-cube svg{width:110px;height:110px;filter:drop-shadow(0 0 30px rgba(0,112,243,.9));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sp-syms{display:flex;gap:18px;margin-bottom:20px}
.sp-syms span{font-size:20px;font-weight:700;animation:sf 2.4s ease-in-out infinite;text-shadow:0 0 12px currentColor}
.sp-syms span:nth-child(1){color:#4ade80}
.sp-syms span:nth-child(2){color:#ff5f5f;animation-delay:.2s}
.sp-syms span:nth-child(3){color:#60a5fa;animation-delay:.4s}
.sp-syms span:nth-child(4){color:#f472b6;animation-delay:.6s}
@keyframes sf{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.sp-bar{width:240px;height:3px;background:rgba(0,112,243,.15);border-radius:3px;overflow:hidden;margin-bottom:10px}
.sp-barin{height:100%;width:0;background:linear-gradient(90deg,#0070f3,#4aa3ff);border-radius:3px;box-shadow:0 0 15px rgba(74,163,255,1);transition:width .2s}
.sp-txt{font-size:10px;letter-spacing:6px;color:var(--txt2);font-weight:300}

/* ============ САЙТ ============ */
#site{display:none;min-height:100vh;background:var(--bg);position:relative;z-index:1}
#site.on{display:block}
.site-nav{position:sticky;top:0;z-index:100;background:rgba(5,7,13,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;padding:12px 20px;gap:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.site-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.site-logo svg{width:34px;height:34px;filter:drop-shadow(0 0 12px rgba(0,112,243,.85))}
.site-name{font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff,#7cc4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.site-nav-links{display:flex;gap:16px;margin-left:auto;align-items:center}
.site-nav-links a{color:var(--txt2);text-decoration:none;font-size:13px;font-weight:500;display:none}
@media(min-width:600px){.site-nav-links a{display:block}}
.site-btn{padding:9px 18px;border-radius:22px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(0,112,243,.45);white-space:nowrap}
.site-btn:active{transform:scale(.96)}

.hero{padding:60px 20px 40px;text-align:center;max-width:900px;margin:0 auto;position:relative}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;background:rgba(0,112,243,.12);border:1px solid rgba(74,163,255,.3);color:#7cc4ff;font-size:11px;font-weight:600;margin-bottom:20px;letter-spacing:.5px}
.hero h1{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:16px;background:linear-gradient(135deg,#fff 0%,#7cc4ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:clamp(14px,2vw,18px);color:var(--txt2);max-width:600px;margin:0 auto 28px;line-height:1.6}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta-primary{padding:14px 32px;border-radius:40px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit;box-shadow:0 12px 40px rgba(0,112,243,.5);display:inline-flex;align-items:center;gap:8px}
.cta-primary:active{transform:scale(.97)}
.cta-secondary{padding:14px 32px;border-radius:40px;background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.cta-secondary:active{transform:scale(.97)}

.hero-ps5{margin:40px auto 60px;max-width:700px;padding:0 20px;position:relative}
.hero-ps5 img{width:100%;border-radius:20px;box-shadow:0 30px 80px rgba(0,112,243,.35)}
.hero-controller{max-width:500px;margin:0 auto}

.section{padding:50px 20px;max-width:1100px;margin:0 auto}
.section-title{font-size:clamp(24px,4vw,36px);font-weight:800;letter-spacing:-1px;margin-bottom:10px;text-align:center}
.section-sub{font-size:14px;color:var(--txt2);text-align:center;max-width:600px;margin:0 auto 40px}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.feat{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:24px;transition:all .3s}
.feat:hover{border-color:rgba(74,163,255,.3);transform:translateY(-3px)}
.feat-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0070f3,#4aa3ff);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,112,243,.4)}
.feat-icon svg{width:24px;height:24px;color:#fff}
.feat h3{font-size:16px;font-weight:700;margin-bottom:6px}
.feat p{font-size:13px;color:var(--txt2);line-height:1.5}

.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.game-card{aspect-ratio:1;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;transition:all .3s}
.game-card:hover{transform:translateY(-4px);border-color:rgba(74,163,255,.4)}
.game-card .q{font-size:40px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 0 20px rgba(74,163,255,.7);position:relative;z-index:2}
.game-card .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9))}
.game-card .nm{position:absolute;bottom:8px;left:10px;right:10px;font-size:11px;font-weight:600;color:#fff;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
.plan{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;text-align:center}
.plan.hot{border-color:rgba(74,163,255,.5);background:linear-gradient(180deg,rgba(0,112,243,.15),rgba(0,112,243,.03));position:relative}
.plan.hot::before{content:'ПОПУЛЯРНЫЙ';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#0070f3,#4aa3ff);color:#fff;font-size:9px;font-weight:800;padding:4px 12px;border-radius:12px;letter-spacing:1px}
.plan h3{font-size:18px;font-weight:700;margin-bottom:6px}
.plan .price{font-size:32px;font-weight:900;margin:14px 0;color:#fff}
.plan .price span{font-size:14px;color:var(--txt3);font-weight:500}
.plan ul{list-style:none;margin:20px 0;text-align:left;font-size:13px;color:var(--txt2)}
.plan ul li{padding:6px 0;display:flex;align-items:center;gap:8px}
.plan ul li::before{content:'✓';color:#4ade80;font-weight:700}
.plan button{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.plan.hot button{background:linear-gradient(135deg,#0070f3,#1a5fd6);border:none;box-shadow:0 8px 24px rgba(0,112,243,.5)}

.site-footer{padding:40px 20px;text-align:center;color:var(--txt3);font-size:12px;border-top:1px solid rgba(255,255,255,.05);margin-top:40px}
.site-footer .links{display:flex;gap:20px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.site-footer a{color:var(--txt2);text-decoration:none;font-size:12px}
.site-footer a:hover{color:var(--acc2)}

/* ============ ОС (ЛАУНЧЕР) ============ */
#os{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,112,243,.16),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(0,112,243,.10),transparent 50%),var(--bg);flex-direction:column;z-index:2}
#os.on{display:flex}

.top{display:flex;align-items:center;padding:12px 20px;gap:14px;flex-shrink:0;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.blogo{width:36px;height:36px;filter:drop-shadow(0 0 12px rgba(0,112,243,.85))}
.blogo svg{width:100%;height:100%}
.bname{font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff,#7cc4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.03);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.05);overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--txt3);cursor:pointer;transition:all .25s;border:none;background:transparent;font-family:inherit;white-space:nowrap}
.tab.on{color:#fff;background:rgba(0,112,243,.2);box-shadow:inset 0 0 0 1px rgba(74,163,255,.4)}
.topr{display:flex;align-items:center;gap:7px;flex-shrink:0}
.ibtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);transition:all .2s;position:relative}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:17px;height:17px}
.pav{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0070f3,#7c3aed);font-size:14px;font-weight:700;color:#fff;border-radius:50%}
.dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}
.dot.off{background:#ef4444}
.clk{font-size:13px;font-weight:600;padding:0 6px;font-variant-numeric:tabular-nums}
@media(max-width:640px){.clk{display:none}.bname{display:none}}

.main{flex:1;display:flex;flex-direction:column;padding:0 20px 10px;overflow:hidden;min-height:0}
.row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:8px 4px 14px;scroll-behavior:smooth;scrollbar-width:none;flex-shrink:0}
.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:130px;height:130px;border-radius:18px;background:var(--bg3);border:2px solid rgba(255,255,255,.06);position:relative;cursor:pointer;overflow:hidden;transition:all .3s;display:flex;align-items:center;justify-content:center}
.tile .tbg{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .tov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85))}
.tile .ttl{position:absolute;bottom:6px;left:8px;right:8px;font-size:10px;font-weight:600;color:#fff;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tile .tq{position:relative;z-index:2;font-size:40px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 0 22px rgba(74,163,255,.7)}
.tile .tic{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;background:rgba(0,112,243,.9);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;z-index:3}
.tile.on{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(74,163,255,.9),0 0 40px rgba(0,112,243,.85);transform:translateY(-4px) scale(1.04)}
.tile.add{border:2px dashed rgba(74,163,255,.4);background:rgba(0,112,243,.05);flex-direction:column;gap:4px}
.tile.add .plus{font-size:32px;color:var(--acc2);font-weight:300;line-height:1}
.tile.add .lbl{font-size:10px;color:var(--txt2)}
@media(max-width:640px){.tile{width:100px;height:100px;border-radius:14px}.tile .tq{font-size:32px}}

.hero-os{flex:1;display:flex;align-items:flex-end;position:relative;min-height:0;overflow:hidden;border-radius:20px;margin-top:4px}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s;opacity:0}
.hbg.load{opacity:1}
.hgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.95) 0%,rgba(5,7,13,.7) 40%,rgba(5,7,13,.2) 70%,rgba(5,7,13,.5) 100%),linear-gradient(0deg,rgba(5,7,13,.9) 0%,transparent 50%);z-index:1}
.hcont{position:relative;z-index:2;padding:24px 28px;display:flex;flex-direction:column;max-width:580px;width:100%}
.hlogo{margin-bottom:10px;min-height:40px;display:flex;align-items:center;font-size:28px;font-weight:900;letter-spacing:-1px;text-shadow:0 0 40px rgba(0,112,243,.7)}
.htitle{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-bottom:8px}
.hsub{font-size:14px;color:var(--txt2);margin-bottom:18px}
.hact{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btnplay{display:inline-flex;align-items:center;gap:8px;padding:13px 38px;border-radius:40px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;box-shadow:0 8px 32px rgba(0,112,243,.55)}
.btnplay:active{transform:scale(.97)}
.btnplay svg{width:18px;height:18px}
.btnr{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.sc{background:rgba(10,14,24,.78);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:10px}
.sc svg{width:20px;height:20px;color:var(--acc2)}
.si{display:flex;flex-direction:column}
.sl{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.sv{font-size:14px;font-weight:700;color:#fff}
@media(max-width:640px){.hcont{padding:16px 18px}.htitle{font-size:22px}.hsub{font-size:12px}.hlogo{font-size:20px}.btnplay{padding:11px 28px;font-size:13px}.btnr{width:42px;height:42px}.sc{padding:7px 11px}.sv{font-size:12px}}

.bot{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0;flex-shrink:0;gap:12px}
.hints{display:flex;gap:14px;align-items:center}
.hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:10px;font-weight:700;color:var(--txt)}
.pad{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;cursor:pointer}
.pad.conn{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}
.pad.disc{color:var(--txt3)}
.pdot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.pad.conn .pdot{background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pd 2s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:640px){.hints{display:none}.pad{font-size:10px;padding:6px 10px}}

/* ============ МОДАЛКИ ============ */
.mo{position:fixed;inset:0;z-index:1000;background:rgba(5,7,13,.88);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;overflow-y:auto}
.mo.open{opacity:1;visibility:visible}
.mo.open .md{transform:translateY(0) scale(1)}
.md{background:linear-gradient(180deg,#0f1523,#0a0e18);border:1px solid rgba(74,163,255,.22);border-radius:22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:24px;transform:translateY(24px) scale(.96);transition:transform .35s;margin:auto}
.md::-webkit-scrollbar{width:6px}
.md::-webkit-scrollbar-thumb{background:rgba(74,163,255,.3);border-radius:3px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.mt{font-size:19px;font-weight:700}
.mc{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.gr{margin-bottom:20px}
.gt{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc2);font-weight:700;margin-bottom:10px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:12px;margin-bottom:7px;gap:10px;flex-wrap:wrap}
.slb{font-size:13px;color:#fff;font-weight:500}
.sd{font-size:10px;color:var(--txt3);margin-top:2px}
.sel{background:rgba(0,112,243,.12);border:1px solid rgba(74,163,255,.3);color:#fff;font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;outline:none}
.sel option{background:#0f1523;color:#fff}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .25s;border:none;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.tg.on{background:var(--acc)}
.tg.on::after{transform:translateX(18px)}
.si2{width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(74,163,255,.25);color:#fff;font-size:14px;font-family:inherit;outline:none}
.si2:focus{border-color:var(--acc2)}
.si2::placeholder{color:var(--txt3)}
.res{margin-top:12px;max-height:340px;overflow-y:auto}
.ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px}
.ri:active{background:rgba(0,112,243,.12)}
.rt{width:42px;height:42px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;background-size:cover;background-position:center}
.rin{flex:1;min-width:0}
.rn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:10px;color:var(--txt3);margin-top:2px}
.ph{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(0,112,243,.08);border:1px solid rgba(74,163,255,.22);border-radius:14px;margin-bottom:20px}
.pa{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0}
.pi{flex:1;min-width:0}
.pn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11px;color:#86efac;margin-top:2px}
.aps{display:flex;gap:8px;flex-wrap:wrap;m
