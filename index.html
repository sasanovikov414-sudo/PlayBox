<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>PlayBox OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#0070f3;--acc2:#4aa3ff;--bg:#05070d;--bg2:#0a0e18;--bg3:#111624;--txt:#fff;--txt2:#b8c2d4;--txt3:#6b7690}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,112,243,.16),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(0,112,243,.10),transparent 50%),var(--bg)}

#boot{position:fixed;inset:0;background:#000;color:#4aa3ff;font-family:'Courier New',monospace;font-size:12px;padding:24px;z-index:9999;overflow:hidden;display:flex;flex-direction:column}
#boot .blogo{font-size:36px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 40px #0070f3;margin-bottom:16px;font-family:monospace}
#boot .bline{opacity:0;animation:bshow .25s forwards;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-size:11px}
#boot .bok{color:#22c55e}
#boot .binfo{color:#4aa3ff}
@keyframes bshow{to{opacity:1}}

#loader{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#0a1428,#05070d 70%);transition:opacity .8s,visibility .8s;padding:20px}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.cubewrap{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc);border-right-color:rgba(74,163,255,.4);animation:spin 2.5s linear infinite}
.ring::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid transparent;border-bottom-color:rgba(74,163,255,.5);animation:spin 3.5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cube{width:120px;height:120px;animation:pulse 3s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(0,112,243,.9))}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(3deg)}}
.cube svg{width:100%;height:100%}
.syms{display:flex;gap:20px;margin-bottom:24px}
.syms span{font-size:22px;font-weight:700;opacity:0;animation:sf 2.4s ease-in-out infinite;text-shadow:0 0 16px currentColor}
.syms span:nth-child(1){color:#4ade80}
.syms span:nth-child(2){color:#ff5f5f;animation-delay:.2s}
.syms span:nth-child(3){color:#60a5fa;animation-delay:.4s}
.syms span:nth-child(4){color:#f472b6;animation-delay:.6s}
@keyframes sf{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.lbar{width:260px;max-width:80vw;height:4px;background:rgba(0,112,243,.15);border-radius:4px;overflow:hidden;margin-bottom:12px}
.lbarin{height:100%;width:0;background:linear-gradient(90deg,#0070f3,#4aa3ff,#7cc4ff);border-radius:4px;box-shadow:0 0 20px rgba(74,163,255,1);transition:width .2s}
.ltxt{font-size:11px;letter-spacing:6px;color:var(--txt2);font-weight:300}

#app{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
#app.vis{opacity:1}

.top{display:flex;align-items:center;padding:12px 20px;gap:14px;flex-shrink:0;z-index:10;position:relative}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.blogo{width:36px;height:36px;filter:drop-shadow(0 0 12px rgba(0,112,243,.85))}
.blogo svg{width:100%;height:100%}
.bname{font-size:20px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,#7cc4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.03);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.05);overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--txt3);cursor:pointer;transition:all .25s;border:none;background:transparent;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab svg{width:15px;height:15px}
.tab.on{color:#fff;background:rgba(0,112,243,.2);box-shadow:inset 0 0 0 1px rgba(74,163,255,.4),0 0 20px rgba(0,112,243,.2)}
.topr{display:flex;align-items:center;gap:7px;flex-shrink:0}
.ibtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);transition:all .2s;position:relative}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:17px;height:17px}
.pav{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0070f3,#7c3aed);font-size:14px;font-weight:700;color:#fff;border-radius:50%}
.dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--bg);box-shadow:0 0 8px #22c55e}
.dot.off{background:#ef4444;box-shadow:0 0 8px #ef4444}
.clk{font-size:13px;font-weight:600;color:#fff;padding:0 6px;font-variant-numeric:tabular-nums}
@media(max-width:640px){.clk{display:none}.bname{display:none}}

.main{flex:1;display:flex;flex-direction:column;padding:0 20px 10px;overflow:hidden;min-height:0;position:relative}
.row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:8px 4px 14px;scroll-behavior:smooth;scrollbar-width:none;flex-shrink:0}
.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:130px;height:130px;border-radius:18px;background:var(--bg3);border:2px solid rgba(255,255,255,.06);position:relative;cursor:pointer;overflow:hidden;transition:all .3s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.tile .tbg{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .tov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85))}
.tile .ttl{position:absolute;bottom:6px;left:8px;right:8px;font-size:10px;font-weight:600;color:#fff;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tile .tq{position:relative;z-index:2;font-size:40px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 0 22px rgba(74,163,255,.7)}
.tile .tic{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;background:rgba(0,112,243,.9);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;z-index:3}
.tile.on{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(74,163,255,.9),0 0 40px rgba(0,112,243,.85);transform:translateY(-4px) scale(1.04)}
.tile.add{border:2px dashed rgba(74,163,255,.4);background:rgba(0,112,243,.05);flex-direction:column;gap:4px}
.tile.add .plus{font-size:32px;color:var(--acc2);font-weight:300;line-height:1}
.tile.add .lbl{font-size:10px;color:var(--txt2);font-weight:500}
@media(max-width:640px){.tile{width:100px;height:100px;border-radius:14px}.tile .tq{font-size:32px}}

.hero{flex:1;display:flex;align-items:flex-end;position:relative;min-height:0;overflow:hidden;border-radius:20px;margin-top:4px}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s;opacity:0}
.hbg.load{opacity:1}
.hgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.95) 0%,rgba(5,7,13,.7) 40%,rgba(5,7,13,.2) 70%,rgba(5,7,13,.5) 100%),linear-gradient(0deg,rgba(5,7,13,.9) 0%,transparent 50%);z-index:1}
.hcont{position:relative;z-index:2;padding:24px 28px;display:flex;flex-direction:column;max-width:580px;width:100%}
.hlogo{margin-bottom:10px;min-height:40px;display:flex;align-items:center;font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px;text-shadow:0 0 40px rgba(0,112,243,.7)}
.htitle{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-bottom:8px}
.hsub{font-size:14px;color:var(--txt2);margin-bottom:18px}
.hact{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btnplay{display:inline-flex;align-items:center;gap:8px;padding:13px 38px;border-radius:40px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;box-shadow:0 8px 32px rgba(0,112,243,.55);transition:all .25s;font-family:inherit}
.btnplay:active{transform:scale(.97)}
.btnplay svg{width:18px;height:18px}
.btnr{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:all .2s}
.btnr:active{transform:scale(.94)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.sc{background:rgba(10,14,24,.78);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:10px}
.sc svg{width:20px;height:20px;color:var(--acc2)}
.si{display:flex;flex-direction:column}
.sl{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.sv{font-size:14px;font-weight:700;color:#fff}
@media(max-width:640px){.hcont{padding:16px 18px}.htitle{font-size:22px}.hsub{font-size:12px;margin-bottom:12px}.hlogo{font-size:20px}.btnplay{padding:11px 28px;font-size:13px}.btnr{width:42px;height:42px}.sc{padding:7px 11px}.sv{font-size:12px}}

.bot{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0;flex-shrink:0;gap:12px}
.hints{display:flex;gap:14px;align-items:center}
.hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3);font-weight:500}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:10px;font-weight:700;color:var(--txt)}
.pad{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;cursor:pointer;transition:all .3s}
.pad.conn{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}
.pad.disc{color:var(--txt3)}
.pdot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.pad.conn .pdot{background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pd 2s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:640px){.hints{display:none}.pad{font-size:10px;padding:6px 10px}}

.mo{position:fixed;inset:0;z-index:1000;background:rgba(5,7,13,.88);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;overflow-y:auto}
.mo.open{opacity:1;visibility:visible}
.mo.open .md{transform:translateY(0) scale(1)}
.md{background:linear-gradient(180deg,#0f1523,#0a0e18);border:1px solid rgba(74,163,255,.22);border-radius:22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.75);transform:translateY(24px) scale(.96);transition:transform .35s;margin:auto}
.md::-webkit-scrollbar{width:6px}
.md::-webkit-scrollbar-thumb{background:rgba(74,163,255,.3);border-radius:3px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.mt{font-size:19px;font-weight:700}
.mc{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.gr{margin-bottom:20px}
.gt{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc2);font-weight:700;margin-bottom:10px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:12px;margin-bottom:7px;gap:10px;flex-wrap:wrap}
.slb{font-size:13px;color:#fff;font-weight:500}
.sd{font-size:10px;color:var(--txt3);margin-top:2px}
.sel{background:rgba(0,112,243,.12);border:1px solid rgba(74,163,255,.3);color:#fff;font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;outline:none}
.sel option{background:#0f1523;color:#fff}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .25s;border:none;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.tg.on{background:var(--acc)}
.tg.on::after{transform:translateX(18px)}
.si2{width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(74,163,255,.25);color:#fff;font-size:14px;font-family:inherit;outline:none}
.si2:focus{border-color:var(--acc2);background:rgba(0,112,243,.08)}
.si2::placeholder{color:var(--txt3)}
.res{margin-top:12px;max-height:340px;overflow-y:auto}
.ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px}
.ri:active{background:rgba(0,112,243,.12)}
.rt{width:42px;height:42px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--txt2);flex-shrink:0}
.rin{flex:1;min-width:0}
.rn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:10px;color:var(--txt3);margin-top:2px}
.ph{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(0,112,243,.08);border:1px solid rgba(74,163,255,.22);border-radius:14px;margin-bottom:20px}
.pa{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#0070f3,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0}
.pi{flex:1;min-width:0}
.pn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11px;color:#86efac;margin-top:2px}
.aps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ap{width:42px;height:42px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.ap.sel{border-color:var(--acc2);box-shadow:0 0 15px rgba(74,163,255,.6)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mi{background:var(--bg3);border:1px solid rgba(255,255,255,.06);border-radius:13px;overflow:hidden;cursor:pointer;transition:all .2s}
.mi:active{transform:scale(.97)}
.mth{height:80px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff}
.mn{font-size:11px;font-weight:600;padding:7px 9px 3px}
.mp{font-size:10px;font-weight:700;color:var(--acc2);padding:0 9px 9px}
.mp.own{color:#86efac}
.bt-dev{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin-bottom:8px;cursor:pointer}
.bt-dev.conn{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.bt-ic{width:40px;height:40px;border-radius:10px;background:rgba(0,112,243,.15);border:1px solid rgba(74,163,255,.3);display:flex;align-items:center;justify-content:center;color:var(--acc2);flex-shrink:0}
.bt-ic svg{width:20px;height:20px}
.bt-inf{flex:1;min-width:0}
.bt-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-s{font-size:10px;color:var(--txt3);margin-top:2px}
.bt-b{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:700;text-transform:uppercase}
.bt-b.on{background:rgba(34,197,94,.2);color:#86efac}
.scan-btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:12px;font-family:inherit}
.scan-btn:disabled{opacity:.5}

.tc{position:fixed;bottom:20px;right:20px;left:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.tst{background:linear-gradient(135deg,#0f1523,#0a0e18);border:1px solid rgba(74,163,255,.35);border-radius:12px;padding:12px 16px;font-size:12px;font-weight:600;color:#fff;box-shadow:0 10px 45px rgba(0,0,0,.65);display:flex;align-items:center;gap:8px;animation:ti .4s;pointer-events:auto;max-width:340px}
.tst.ok{border-color:rgba(34,197,94,.5)}
.tst.err{border-color:rgba(239,68,68,.5)}
@keyframes ti{from{opacity:0;transform:translateX(45px)}to{opacity:1;transform:translateX(0)}}
.tst.out{animation:to .3s forwards}
@keyframes to{to{opacity:0;transform:translateX(45px)}}

#site{position:fixed;inset:0;z-index:500;background:var(--bg);overflow-y:auto;display:none;padding-bottom:40px}
#site.on{display:block}
.site-nav{position:sticky;top:0;z-index:10;background:rgba(5,7,13,.85);backdrop-filter:blur(20px);display:flex;align-items:center;padding:12px 20px;gap:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.site-hero{padding:60px 20px 40px;text-align:center;max-width:900px;margin:0 auto}
.site-hero h1{font-size:clamp(32px,7vw,64px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:16px;background:linear-gradient(135deg,#fff,#7cc4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.site-hero p{font-size:clamp(14px,2vw,17px);color:var(--txt2);max-width:600px;margin:0 auto 28px;line-height:1.6}
.site-cta{display:inline-flex;align-items:center;gap:8px;padding:14px 34px;border-radius:40px;background:linear-gradient(135deg,#0070f3,#1a5fd6);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;box-shadow:0 12px 40px rgba(0,112,243,.5);font-family:inherit}
.site-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:0 20px;max-width:1100px;margin:0 auto 40px}
.feat{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:22px}
.feat-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#0070f3,#4aa3ff);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.feat-icon svg{width:22px;height:22px;color:#fff}
.feat h3{font-size:16px;font-weight:700;margin-bottom:6px}
.feat p{font-size:13px;color:var(--txt2);line-height:1.5}
.site-footer{padding:30px 20px;text-align:center;color:var(--txt3);font-size:12px;border-top:1px solid rgba(255,255,255,.05)}

#err{position:fixed;inset:0;background:#000;color:#ff6b6b;padding:20px;font-family:monospace;font-size:12px;z-index:99999;display:none;overflow:auto;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<div id="err"></div>

<div id="boot">
  <div class="blogo">PlayBox OS</div>
  <div id="bootlog"></div>
</div>

<div id="loader">
  <div class="cubewrap">
    <div class="ring"></div>
    <div class="cube">
      <svg viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4aa3ff"/><stop offset="100%" stop-color="#0070f3"/></linearGradient>
          <filter id="gl"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path d="M50 8 L88 28 L88 72 L50 92 L12 72 L12 28 Z" stroke="url(#cg)" stroke-width="2.5" fill="none" filter="url(#gl)"/>
        <path d="M50 8 L50 50 M50 50 L88 28 M50 50 L12 28" stroke="url(#cg)" stroke-width="1.5" opacity=".6"/>
