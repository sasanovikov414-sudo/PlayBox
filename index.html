<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PlayBox — Твой мир. Твоя станция.</title>
<style>
  /* ==================== БАЗОВЫЕ СТИЛИ ==================== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --accent: #2b7fff;
    --accent-glow: #4aa3ff;
    --bg-0: #05070d;
    --bg-1: #0a0e18;
    --bg-2: #111624;
    --text-0: #ffffff;
    --text-1: #b8c2d4;
    --text-2: #6b7690;
    --radius: 16px;
    --radius-sm: 10px;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--bg-0);
    color: var(--text-0);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(43,127,255,0.15), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(43,127,255,0.10), transparent 50%),
      var(--bg-0);
  }
  /* Анимированные волны фона */
  .bg-waves {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
  }
  .wave {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%; left: -50%;
    background: radial-gradient(circle at center, rgba(43,127,255,0.08), transparent 60%);
    animation: waveMove 18s ease-in-out infinite;
  }
  .wave:nth-child(2) { animation-delay: -6s; background: radial-gradient(circle at 30% 70%, rgba(74,163,255,0.06), transparent 55%); }
  .wave:nth-child(3) { animation-delay: -12s; background: radial-gradient(circle at 70% 30%, rgba(43,127,255,0.05), transparent 50%); }
  @keyframes waveMove {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(-3%, 2%) rotate(1deg); }
    66% { transform: translate(2%, -2%) rotate(-1deg); }
  }

  /* ==================== ЭКРАН ЗАГРУЗКИ ==================== */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a1428 0%, #05070d 70%);
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-cube-wrap {
    position: relative;
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 40px;
  }
  .loader-ring {
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: rgba(74,163,255,0.4);
    animation: spin 2.5s linear infinite;
  }
  .loader-ring::before {
    content: '';
    position: absolute; inset: 8px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-bottom-color: rgba(74,163,255,0.5);
    animation: spin 3.5s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-cube {
    width: 110px; height: 110px;
    position: relative;
    animation: cubePulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(43,127,255,0.8));
  }
  @keyframes cubePulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.05) rotate(2deg); }
  }
  .loader-cube svg { width: 100%; height: 100%; }
  .loader-symbols {
    display: flex; gap: 22px; margin-bottom: 30px;
  }
  .loader-symbols span {
    font-size: 22px; font-weight: 700;
    opacity: 0; animation: symbolFade 2.4s ease-in-out infinite;
    text-shadow: 0 0 12px currentColor;
  }
  .loader-symbols span:nth-child(1) { color: #4ade80; animation-delay: 0s; }
  .loader-symbols span:nth-child(2) { color: #ff5f5f; animation-delay: 0.2s; }
  .loader-symbols span:nth-child(3) { color: #60a5fa; animation-delay: 0.4s; }
  .loader-symbols span:nth-child(4) { color: #f472b6; animation-delay: 0.6s; }
  @keyframes symbolFade {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
  .loader-progress {
    width: 260px; height: 4px;
    background: rgba(43,127,255,0.15);
    border-radius: 4px; overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 0 12px rgba(43,127,255,0.3);
  }
  .loader-progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2b7fff, #4aa3ff, #7cc4ff);
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(74,163,255,0.9);
    transition: width 0.3s ease;
  }
  .loader-text {
    font-size: 12px; letter-spacing: 6px; color: var(--text-1);
    font-weight: 300; text-transform: uppercase;
  }

  /* ==================== ОСНОВНОЙ ИНТЕРФЕЙС ==================== */
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #app.visible { opacity: 1; }

  /* ---- Верхняя панель ---- */
  .topbar {
    display: flex; align-items: center;
    padding: 16px 28px;
    gap: 24px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-right: 20px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .brand:active { transform: scale(0.96); }
  .brand-logo {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 10px rgba(43,127,255,0.7));
  }
  .brand-logo svg { width: 100%; height: 100%; }
  .brand-name {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff, #7cc4ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav-tabs {
    display: flex; gap: 6px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 4px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .nav-tab {
    padding: 8px 20px;
    border-radius: 9px;
    font-size: 14px; font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.25s ease;
    border: none; background: transparent;
    font-family: inherit;
    white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text-1); }
  .nav-tab.active {
    color: #fff;
    background: rgba(43,127,255,0.18);
    box-shadow: inset 0 0 0 1px rgba(74,163,255,0.4), 0 0 20px rgba(43,127,255,0.15);
  }
  .topbar-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-1);
    transition: all 0.2s ease;
    position: relative;
  }
  .icon-btn:hover {
    background: rgba(43,127,255,0.15);
    color: #fff;
    border-color: rgba(74,163,255,0.4);
    box-shadow: 0 0 18px rgba(43,127,255,0.25);
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 19px; height: 19px; }
  .profile-btn { padding: 0; overflow: hidden; }
  .profile-avatar {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2b7fff, #7c3aed);
    font-size: 16px; font-weight: 700; color: #fff;
  }
  .status-dot {
    position: absolute; bottom: 2px; right: 2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #22c55e;
    border: 2px solid var(--bg-0);
    box-shadow: 0 0 8px #22c55e;
  }
  .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .clock {
    font-size: 15px; font-weight: 600;
    color: var(--text-0);
    padding: 0 8px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  /* ---- Основная область ---- */
  .main {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 0 28px 20px;
    overflow: hidden;
    position: relative;
  }

  /* ---- Карусель игр ---- */
  .games-row {
    display: flex; gap: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 4px 18px;
    scroll-behavior: smooth;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  .games-row::-webkit-scrollbar { display: none; }

  .game-tile {
    flex: 0 0 auto;
    width: 140px; height: 140px;
    border-radius: 18px;
    background: var(--bg-2);
    border: 2px solid rgba(255,255,255,0.06);
    position: relative;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .game-tile .tile-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform 0.4s ease;
  }
  .game-tile .tile-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.85));
    opacity: 0.9;
  }
  .game-tile .tile-title {
    position: absolute; bottom: 8px; left: 10px; right: 10px;
    font-size: 11px; font-weight: 600;
    color: #fff; z-index: 2;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-tile .tile-question {
    position: relative; z-index: 2;
    font-size: 44px; font-weight: 800;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 0 20px rgba(74,163,255,0.6);
    transition: transform 0.3s ease;
  }
  .game-tile .tile-icon {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 6px;
    background: rgba(43,127,255,0.85);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    z-index: 3;
    box-shadow: 0 0 10px rgba(43,127,255,0.7);
  }
  .game-tile:hover {
    transform: translateY(-4px) scale(1.03);
    border-color: rgba(74,163,255,0.5);
    box-shadow: 0 8px 30px rgba(43,127,255,0.35);
  }
  .game-tile:hover .tile-bg { transform: scale(1.08); }
  .game-tile.focused {
    border-color: var(--accent-glow);
    box-shadow: 0 0 0 2px rgba(74,163,255,0.8), 0 0 35px rgba(43,127,255,0.7);
    transform: translateY(-4px) scale(1.05);
  }
  .game-tile.focused .tile-question { transform: scale(1.1); }
  .game-tile.active {
    width: 160px;
    border-color: var(--accent-glow);
    box-shadow: 0 0 0 2px var(--accent-glow), 0 0 40px rgba(43,127,255,0.8);
  }
  .game-tile.add-tile {
    border: 2px dashed rgba(74,163,255,0.4);
    background: rgba(43,127,255,0.05);
    flex-direction: column; gap: 6px;
  }
  .game-tile.add-tile:hover {
    border-color: var(--accent-glow);
    background: rgba(43,127,255,0.12);
  }
  .add-plus { font-size: 36px; color: var(--accent-glow); font-weight: 300; line-height: 1; }
  .add-label { font-size: 11px; color: var(--text-1); font-weight: 500; }

  /* ---- Центральный баннер (детали выбранной игры) ---- */
  .hero {
    flex: 1;
    display: flex;
    align-items: flex-end;
    position: relative;
    min-height: 0;
    overflow: hidden;
    border-radius: 20px;
    margin-top: 4px;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
    opacity: 0;
  }
  .hero-bg.loaded { opacity: 1; }
  .hero-gradient {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,7,13,0.95) 0%, rgba(5,7,13,0.75) 35%, rgba(5,7,13,0.2) 65%, rgba(5,7,13,0.5) 100%),
      linear-gradient(0deg, rgba(5,7,13,0.9) 0%, transparent 50%);
    z-index: 1;
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 32px 40px;
    display: flex; flex-direction: column;
    max-width: 560px;
  }
  .hero-logo-area {
    margin-bottom: 12px;
    min-height: 60px;
    display: flex; align-items: center;
  }
  .hero-title {
    font-size: 40px; font-weight: 800;
    line-height: 1.05; letter-spacing: -1px;
    margin-bottom: 8px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .hero-subtitle {
    font-size: 15px; color: var(--text-1);
    margin-bottom: 24px;
    font-weight: 400;
  }
  .hero-actions {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .btn-play {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 44px;
    border-radius: 40px;
    background: linear-gradient(135deg, #2b7fff, #1a5fd6);
    color: #fff; font-size: 16px; font-weight: 700;
    border: none; cursor: pointer;
    box-shadow: 0 8px 30px rgba(43,127,255,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.25s ease;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .btn-play::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .btn-play:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(43,127,255,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }
  .btn-play:hover::before { opacity: 1; }
  .btn-play:active { transform: translateY(0) scale(0.97); }
  .btn-play svg { width: 18px; height: 18px; }

  .btn-icon-round {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }
  .btn-icon-round:hover {
    background: rgba(43,127,255,0.25);
    border-color: rgba(74,163,255,0.5);
    transform: scale(1.06);
  }
  .btn-icon-round:active { transform: scale(0.94); }

  .hero-stats {
    display: flex; gap: 12px;
    margin-top: 4px;
  }
  .stat-card {
    background: rgba(10,14,24,0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 18px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(10px);
  }
  .stat-card svg { width: 22px; height: 22px; color: var(--accent-glow); }
  .stat-info { display: flex; flex-direction: column; }
  .stat-label { font-size: 10px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 15px; font-weight: 700; color: #fff; }
  .stat-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.1); }

  /* ---- Нижняя панель управления ---- */
  .bottombar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 0;
    flex-shrink: 0;
    gap: 16px;
  }
  .hint-group { display: flex; gap: 18px; align-items: center; }
  .hint {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-2);
    font-weight: 500;
  }
  .key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px; font-weight: 700; color: var(--text-0);
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .key.cross { color: #60a5fa; }
  .key.circle { color: #f87171; }
  .key.square { color: #f472b6; }
  .key.triangle { color: #4ade80; }

  .pad-status {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; font-weight: 600;
    transition: all 0.3s ease;
  }
  .pad-status.connected {
    background: rgba(34,197,94,0.12);
    border-color: rgba(34,197,94,0.4);
    color: #86efac;
    box-shadow: 0 0 20px rgba(34,197,94,0.2);
  }
  .pad-status.disconnected { color: var(--text-2); }
  .pad-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444;
    transition: all 0.3s ease;
  }
  .pad-status.connected .pad-dot {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
    animation: pulseDot 2s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ==================== МОДАЛЬНЫЕ ОКНА ==================== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(5,7,13,0.85);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal {
    background: linear-gradient(180deg, #0f1523, #0a0e18);
    border: 1px solid rgba(74,163,255,0.2);
    border-radius: 22px;
    width: 100%; max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(74,163,255,0.1), 0 0 60px rgba(43,127,255,0.15);
    transform: translateY(20px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(74,163,255,0.3); border-radius: 3px; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .modal-close {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.2s;
  }
  .modal-close:hover { background: rgba(239,68,68,0.2); color: #fff; border-color: rgba(239,68,68,0.4); }

  .settings-group { margin-bottom: 22px; }
  .settings-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--accent-glow); font-weight: 700;
    margin-bottom: 12px;
  }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    margin-bottom: 8px;
    gap: 12px;
  }
  .setting-label { font-size: 14px; color: var(--text-0); font-weight: 500; }
  .setting-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .setting-control { flex-shrink: 0; }
  .select-control {
    background: rgba(43,127,255,0.12);
    border: 1px solid rgba(74,163,255,0.3);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 9px;
    cursor: pointer; font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }
  .select-control:hover { background: rgba(43,127,255,0.25); }
  .select-control option { background: #0f1523; color: #fff; }

  .toggle {
    width: 46px; height: 26px; border-radius: 13px;
    background: rgba(255,255,255,0.12);
    position: relative; cursor: pointer;
    transition: background 0.25s;
    border: none;
  }
  .toggle::after {
    content: ''; position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .toggle.on { background: var(--accent); box-shadow: 0 0 18px rgba(43,127,255,0.6); }
  .toggle.on::after { transform: translateX(20px); }

  /* Профиль */
  .profile-header {
    display: flex; align-items: center; gap: 16px;
